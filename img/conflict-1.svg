<svg xmlns="http://www.w3.org/2000/svg" width="564" height="618" viewBox="0 0 564 618" font-family="DejaVu Sans Mono, Consolas, Menlo, monospace">
<rect width="564" height="618" rx="10" fill="#101418"/>
<rect width="564" height="42" rx="10" fill="#1d232b"/>
<rect y="32" width="564" height="10" fill="#1d232b"/>
<circle cx="18" cy="21" r="5" fill="#ff5f56"/>
<circle cx="34" cy="21" r="5" fill="#ffbd2e"/>
<circle cx="50" cy="21" r="5" fill="#27c93f"/>
<text x="78" y="26" fill="#c8d1dc" font-size="13">충돌: src/utils.py (PR-05 vs PR-02)</text>
<text x="18" y="74" fill="#e6edf3" font-size="14" xml:space="preserve">$ sed -n '/^&lt;&lt;&lt;&lt;&lt;&lt;&lt;/,/^&gt;&gt;&gt;&gt;&gt;&gt;&gt;/p' src/utils.py</text>
<text x="18" y="94" fill="#e6edf3" font-size="14" xml:space="preserve">&lt;&lt;&lt;&lt;&lt;&lt;&lt; HEAD</text>
<text x="18" y="114" fill="#e6edf3" font-size="14" xml:space="preserve">def add(a: int | float, b: int | float) -&gt; int | float:</text>
<text x="18" y="134" fill="#e6edf3" font-size="14" xml:space="preserve">    """a와 b를 더한 값을 반환한다.</text>
<text x="18" y="154" fill="#e6edf3" font-size="14" xml:space="preserve"></text>
<text x="18" y="174" fill="#e6edf3" font-size="14" xml:space="preserve">    &gt;&gt;&gt; add(1, 2)</text>
<text x="18" y="194" fill="#e6edf3" font-size="14" xml:space="preserve">    3</text>
<text x="18" y="214" fill="#e6edf3" font-size="14" xml:space="preserve">    &gt;&gt;&gt; add(-1, 1)</text>
<text x="18" y="234" fill="#e6edf3" font-size="14" xml:space="preserve">    0</text>
<text x="18" y="254" fill="#e6edf3" font-size="14" xml:space="preserve">    """</text>
<text x="18" y="274" fill="#e6edf3" font-size="14" xml:space="preserve">    return a + b</text>
<text x="18" y="294" fill="#e6edf3" font-size="14" xml:space="preserve">=======</text>
<text x="18" y="314" fill="#e6edf3" font-size="14" xml:space="preserve">def subtract(a: int | float, b: int | float) -&gt; int | float:</text>
<text x="18" y="334" fill="#e6edf3" font-size="14" xml:space="preserve">    """a에서 b를 뺀 값을 반환한다.</text>
<text x="18" y="354" fill="#e6edf3" font-size="14" xml:space="preserve"></text>
<text x="18" y="374" fill="#e6edf3" font-size="14" xml:space="preserve">    &gt;&gt;&gt; subtract(3, 1)</text>
<text x="18" y="394" fill="#e6edf3" font-size="14" xml:space="preserve">    2</text>
<text x="18" y="414" fill="#e6edf3" font-size="14" xml:space="preserve">    &gt;&gt;&gt; subtract(1, 3)</text>
<text x="18" y="434" fill="#e6edf3" font-size="14" xml:space="preserve">    -2</text>
<text x="18" y="454" fill="#e6edf3" font-size="14" xml:space="preserve">    """</text>
<text x="18" y="474" fill="#e6edf3" font-size="14" xml:space="preserve">    return a - b</text>
<text x="18" y="494" fill="#e6edf3" font-size="14" xml:space="preserve">&gt;&gt;&gt;&gt;&gt;&gt;&gt; origin/main</text>
<text x="18" y="514" fill="#e6edf3" font-size="14" xml:space="preserve">&lt;&lt;&lt;&lt;&lt;&lt;&lt; HEAD</text>
<text x="18" y="534" fill="#e6edf3" font-size="14" xml:space="preserve">    assert add(1, 2) == 3</text>
<text x="18" y="554" fill="#e6edf3" font-size="14" xml:space="preserve">=======</text>
<text x="18" y="574" fill="#e6edf3" font-size="14" xml:space="preserve">    assert subtract(3, 1) == 2 and subtract(1, 3) == -2</text>
<text x="18" y="594" fill="#e6edf3" font-size="14" xml:space="preserve">&gt;&gt;&gt;&gt;&gt;&gt;&gt; origin/main</text>
</svg>
